<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"brand_primary","type":"color","label":"Brand Primary","default":"#111827"},
    {"id":"brand_accent","type":"color","label":"Brand Accent","default":"#6366f1"},
    {"id":"brand_font","type":"string","label":"Brand Font","default":"Inter, system-ui, sans-serif"},
    {"id":"logo_url","type":"string","label":"Logo URL","default":""},
    {"id":"caption_en","type":"string","label":"Caption (English)","default":"Your caption here"},
    {"id":"caption_zh","type":"string","label":"Caption (Chinese)","default":"你的字幕在这里"},
    {"id":"background_url","type":"string","label":"Background Image URL","default":""},
    {"id":"width","type":"number","label":"Width","default":1080},
    {"id":"height","type":"number","label":"Height","default":1920},
    {"id":"duration","type":"number","label":"Duration (seconds)","default":6}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Default web-safe font stack — overridden at runtime via --brand-font CSS var.
         @font-face is required by the hyperframes linter so the renderer can supply
         at least the fallback stack without a network request. */
      @font-face {
        font-family: 'BrandFont';
        src: local('Inter'), local('system-ui'), local('sans-serif');
        font-weight: 100 900;
        font-style: normal;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #000; }

      #root {
        position: relative;
        overflow: hidden;
        background: var(--brand-primary, #111827);
      }

      /* Full-frame background image */
      #bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: none;
      }
      #bg-image.visible { display: block; }

      /* Logo — top-left corner with safe padding */
      #logo-mark {
        position: absolute;
        top: 80px;
        left: 80px;
        width: 80px;
        height: 80px;
        object-fit: contain;
        display: none;
        z-index: 3;
        border-radius: 12px;
      }
      #logo-mark.visible { display: block; }

      /* Bottom-third caption zone */
      #caption-zone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 80px;
        z-index: 2;
      }

      /* Dark scrim behind captions */
      #caption-scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 55%;
        background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 60%, transparent 100%);
        z-index: 1;
      }

      /* Accent left-bar for brand flavour */
      #caption-bar {
        display: block;
        width: 6px;
        height: 100%;
        position: absolute;
        left: 80px;
        bottom: 80px;
        background: var(--brand-accent, #6366f1);
        border-radius: 3px;
        z-index: 2;
        opacity: 0;
      }

      #caption-en {
        font-family: BrandFont, Inter, system-ui, sans-serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.15;
        color: #ffffff;
        text-shadow: 0 2px 16px rgba(0,0,0,0.6);
        position: relative;
        z-index: 2;
        max-width: 920px;
        padding-left: 20px;
      }

      #caption-zh {
        font-family: BrandFont, Inter, system-ui, sans-serif;
        font-weight: 500;
        font-size: 48px;
        line-height: 1.3;
        color: rgba(255,255,255,0.88);
        text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        position: relative;
        z-index: 2;
        max-width: 920px;
        padding-left: 20px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="bilingual-caption"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Background image (hidden until JS shows it) -->
      <img id="bg-image" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" />

      <!-- Gradient scrim over background -->
      <div id="caption-scrim"></div>

      <!-- Main clip — caption zone -->
      <section
        class="clip"
        id="caption-zone"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      >
        <span id="caption-bar"></span>
        <p id="caption-en">Your caption here</p>
        <p id="caption-zh">你的字幕在这里</p>
      </section>

      <!-- Logo mark — no timing attrs; visibility controlled by JS class toggle -->
      <img id="logo-mark" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Logo" />
    </div>

    <script>
      // ── 1. Resolve variables ──────────────────────────────────────────────
      var vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};

      var brandPrimary   = vars.brand_primary   || '#111827';
      var brandAccent    = vars.brand_accent     || '#6366f1';
      var brandFont      = vars.brand_font       || 'Inter, system-ui, sans-serif';
      var logoUrl        = vars.logo_url         || '';
      var captionEn      = vars.caption_en       || 'Your caption here';
      var captionZh      = vars.caption_zh       || '你的字幕在这里';
      var backgroundUrl  = vars.background_url   || '';
      var compWidth      = Number(vars.width)    || 1080;
      var compHeight     = Number(vars.height)   || 1920;
      var compDuration   = Number(vars.duration) || 6;

      // ── 2. Apply CSS custom properties + inject brand font ───────────────
      document.documentElement.style.setProperty('--brand-primary', brandPrimary);
      document.documentElement.style.setProperty('--brand-accent',  brandAccent);
      // Inject brand_font as the concrete BrandFont family via a style tag so
      // the linter's @font-face declaration is satisfied and the runtime value wins.
      var fontStyleEl = document.createElement('style');
      fontStyleEl.textContent = [
        '@font-face {',
        '  font-family: BrandFont;',
        '  src: local("' + brandFont.split(',')[0].trim().replace(/['"]/g, '') + '"), local("system-ui"), local("sans-serif");',
        '  font-weight: 100 900;',
        '}'
      ].join('\n');
      document.head.appendChild(fontStyleEl);

      // ── 3. Size the root (variable-driven dimensions) ────────────────────
      var root = document.getElementById('root');
      root.setAttribute('data-width',    String(compWidth));
      root.setAttribute('data-height',   String(compHeight));
      root.setAttribute('data-duration', String(compDuration));
      root.style.width  = compWidth  + 'px';
      root.style.height = compHeight + 'px';
      document.documentElement.style.width  = compWidth  + 'px';
      document.documentElement.style.height = compHeight + 'px';
      document.body.style.width  = compWidth  + 'px';
      document.body.style.height = compHeight + 'px';

      // ── 4. Background ─────────────────────────────────────────────────────
      var bgImg = document.getElementById('bg-image');
      if (backgroundUrl) {
        bgImg.src = backgroundUrl;
        bgImg.classList.add('visible');
        // Scrim is always shown (it's needed with a bg image)
      } else {
        // No bg image — root uses brand_primary card; hide scrim
        document.getElementById('caption-scrim').style.opacity = '0';
      }

      // ── 5. Logo ───────────────────────────────────────────────────────────
      var logoMark = document.getElementById('logo-mark');
      if (logoUrl) {
        logoMark.src = logoUrl;
        logoMark.classList.add('visible');
      }

      // ── 6. Caption text ───────────────────────────────────────────────────
      document.getElementById('caption-en').textContent = captionEn;
      document.getElementById('caption-zh').textContent = captionZh;

      // ── 7. Build the single paused GSAP timeline ──────────────────────────
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Caption bar slides in first
      tl.to('#caption-bar',  { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.15);

      // EN caption fades + slides up
      tl.from('#caption-en', { y: 40, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.25);

      // ZH caption follows 0.15s after
      tl.from('#caption-zh', { y: 30, opacity: 0, duration: 0.5,  ease: 'power3.out' }, 0.4);

      // Logo fades in (if visible it will animate; if display:none GSAP skips gracefully)
      tl.from('#logo-mark',  { opacity: 0, scale: 0.85, duration: 0.45, ease: 'back.out(1.4)', transformOrigin: 'top left' }, 0.2);

      // Background image fades in slightly if present
      tl.from('#bg-image',   { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);

      window.__timelines['bilingual-caption'] = tl;
    </script>
  </body>
</html>
