<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"brand_primary","type":"color","label":"Brand Primary","default":"#111827"},
    {"id":"brand_accent","type":"color","label":"Brand Accent","default":"#6366f1"},
    {"id":"brand_font","type":"string","label":"Brand Font","default":"Inter, system-ui, sans-serif"},
    {"id":"logo_url","type":"string","label":"Logo URL","default":""},
    {"id":"caption_en","type":"string","label":"Caption (English)","default":"Your caption here"},
    {"id":"caption_zh","type":"string","label":"Caption (Chinese)","default":"你的字幕在这里"},
    {"id":"background_url","type":"string","label":"Background Image URL","default":""},
    {"id":"duration","type":"number","label":"Duration (seconds)","default":6}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'BrandFont';
        src: local('Inter'), local('system-ui'), local('sans-serif');
        font-weight: 100 900;
        font-style: normal;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--brand-primary, #111827);
      }

      #bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: none;
      }
      #bg-image.visible { display: block; }

      #logo-mark {
        position: absolute;
        top: 60px;
        left: 80px;
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: none;
        z-index: 3;
        border-radius: 10px;
      }
      #logo-mark.visible { display: block; }

      #caption-zone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 80px 160px;
        z-index: 2;
      }

      #caption-scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 65%;
        background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 60%, transparent 100%);
        z-index: 1;
      }

      #caption-bar {
        display: block;
        width: 6px;
        height: 100%;
        position: absolute;
        left: 160px;
        bottom: 80px;
        background: var(--brand-accent, #6366f1);
        border-radius: 3px;
        z-index: 2;
        opacity: 0;
      }

      #caption-en {
        font-family: BrandFont, Inter, system-ui, sans-serif;
        font-weight: 700;
        font-size: 64px;
        line-height: 1.15;
        color: #ffffff;
        text-shadow: 0 2px 16px rgba(0,0,0,0.6);
        position: relative;
        z-index: 2;
        max-width: 1400px;
        padding-left: 20px;
      }

      #caption-zh {
        font-family: BrandFont, Inter, system-ui, sans-serif;
        font-weight: 500;
        font-size: 42px;
        line-height: 1.3;
        color: rgba(255,255,255,0.88);
        text-shadow: 0 2px 12px rgba(0,0,0,0.5);
        position: relative;
        z-index: 2;
        max-width: 1400px;
        padding-left: 20px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="bilingual-caption"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <img id="bg-image" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" />
      <div id="caption-scrim"></div>

      <section
        class="clip"
        id="caption-zone"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      >
        <span id="caption-bar"></span>
        <p id="caption-en">Your caption here</p>
        <p id="caption-zh">你的字幕在这里</p>
      </section>

      <img id="logo-mark" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Logo" />
    </div>

    <script>
      var vars = window.__hyperframes ? window.__hyperframes.getVariables() : {};

      var brandPrimary   = vars.brand_primary   || '#111827';
      var brandAccent    = vars.brand_accent     || '#6366f1';
      var brandFont      = vars.brand_font       || 'Inter, system-ui, sans-serif';
      var logoUrl        = vars.logo_url         || '';
      var captionEn      = vars.caption_en       || 'Your caption here';
      var captionZh      = vars.caption_zh       || '你的字幕在这里';
      var backgroundUrl  = vars.background_url   || '';
      var compDuration   = Number(vars.duration) || 6;

      document.documentElement.style.setProperty('--brand-primary', brandPrimary);
      document.documentElement.style.setProperty('--brand-accent',  brandAccent);

      var fontStyleEl = document.createElement('style');
      fontStyleEl.textContent = [
        '@font-face {',
        '  font-family: BrandFont;',
        '  src: local("' + brandFont.split(',')[0].trim().replace(/['"]/g, '') + '"), local("system-ui"), local("sans-serif");',
        '  font-weight: 100 900;',
        '}'
      ].join('\n');
      document.head.appendChild(fontStyleEl);

      if (compDuration !== 6) {
        document.getElementById('root').setAttribute('data-duration', String(compDuration));
        document.getElementById('caption-zone').setAttribute('data-duration', String(compDuration));
      }

      var bgImg = document.getElementById('bg-image');
      if (backgroundUrl) {
        bgImg.src = backgroundUrl;
        bgImg.classList.add('visible');
      } else {
        document.getElementById('caption-scrim').style.opacity = '0';
      }

      var logoMark = document.getElementById('logo-mark');
      if (logoUrl) {
        logoMark.src = logoUrl;
        logoMark.classList.add('visible');
      }

      document.getElementById('caption-en').textContent = captionEn;
      document.getElementById('caption-zh').textContent = captionZh;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      tl.to('#caption-bar',  { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.15);
      tl.from('#caption-en', { y: 40, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.25);
      tl.from('#caption-zh', { y: 30, opacity: 0, duration: 0.5,  ease: 'power3.out' }, 0.4);
      tl.from('#logo-mark',  { opacity: 0, scale: 0.85, duration: 0.45, ease: 'back.out(1.4)', transformOrigin: 'top left' }, 0.2);
      tl.from('#bg-image',   { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);

      window.__timelines['bilingual-caption'] = tl;
    </script>
  </body>
</html>
